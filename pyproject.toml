[project]
name = "covered-call-index"
version = "0.1.0"
description = "Fetch YieldMax option-income ETF data and generate text, JSON, and Excel reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "xlsxwriter>=3.2",
    "yfinance>=0.2.40",
]

[project.scripts]
yieldmax-report = "covered_call_index.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
    "ty>=0.0.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
